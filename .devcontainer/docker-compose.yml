version: "3.7"

services:
  revealjs-slides:
    container_name: revealjs-slides
    hostname: revealjs-slides.local
    build:
      context: .
    working_dir: /src
    volumes:
      - ..:/src:cached
    command: >
      bash -c "sleep infinity"
    networks:
      revealjs-slides-net:

networks:
  revealjs-slides-net:
